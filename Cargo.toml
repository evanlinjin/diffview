[package]
name = "dv-review"
version = "0.91.11"
edition = "2024"
rust-version = "1.89"
description = "A terminal diff viewer for reviewing GitHub PRs: Helix keys, rust-analyzer, inline review comments, and Claude Code reviews"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evanlinjin/diffview"
readme = "README.md"
keywords = ["diff", "code-review", "github", "tui", "helix"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
emojis = "=0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "yaml-load"] }
toml = "1.1.8"

[[bin]]
name = "dv"
path = "src/main.rs"
